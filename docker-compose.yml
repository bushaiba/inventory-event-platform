services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "5432:5432"
    volumes:
      - inventory-postgres:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      IEP_DATABASE_URL: postgresql+psycopg://inventory:inventory@postgres:5432/inventory
      IEP_DATA_DIR: /app/data
      IEP_OUTBOX_MAX_ATTEMPTS: "3"
    ports:
      - "8000:8000"
    volumes:
      - inventory-data:/app/data

volumes:
  inventory-postgres:
  inventory-data:
